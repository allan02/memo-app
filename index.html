<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 할 일</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>📋 나의 할 일</h1>
        </header>

        <section class="progress-section" aria-label="할 일 진행 상황">
            <div class="progress-bar"
                 id="progress-bar"
                 role="progressbar"
                 aria-valuemin="0"
                 aria-valuemax="100"
                 aria-valuenow="0"
                 aria-label="할 일 진행률">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <p class="progress-text" id="progress-text">0 / 0 완료 (0%)</p>
        </section>

        <section class="input-section" aria-label="할 일 추가">
            <label for="todo-input" class="sr-only">할 일 내용</label>
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요">

            <label for="category-select" class="sr-only">카테고리 선택</label>
            <select id="category-select">
                <option value="auto">자동</option>
                <option value="work">업무</option>
                <option value="personal">개인</option>
                <option value="study">공부</option>
            </select>

            <button type="button" id="add-button">추가</button>
            <p class="auto-hint" id="auto-hint" aria-live="polite" hidden></p>
        </section>

        <section class="filter-section"
                 role="group"
                 aria-label="카테고리 필터">
            <button type="button" class="filter-button" data-filter="all" aria-pressed="false">전체</button>
            <button type="button" class="filter-button" data-filter="work" aria-pressed="false">업무</button>
            <button type="button" class="filter-button" data-filter="personal" aria-pressed="false">개인</button>
            <button type="button" class="filter-button" data-filter="study" aria-pressed="false">공부</button>
        </section>

        <section class="list-section" aria-label="할 일 목록">
            <ul id="todo-list"></ul>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
